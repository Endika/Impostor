<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" sizes="48x48" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Offline party game — find the impostor. No login." />
    <title>Impostor</title>
    <style>
      /* Prevent accidental zoom on mobile: block double-tap zoom, keep scroll/tap. */
      html {
        touch-action: manipulation;
      }
    </style>
    <script>
      // iOS Safari ignores user-scalable=no, so block pinch-zoom explicitly.
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault()
      })
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
